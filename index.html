<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>AI Voice & Chat English Tutor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            position: fixed;
            top: 0;
            left: 0;
        }

        #app-root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        #chat-box {
            touch-action: pan-y;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">

    <div id="app-root">
        <!-- Header -->
        <header class="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md flex items-center justify-between px-4 md:px-8 z-10 shrink-0">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-xl shadow-lg shadow-indigo-500/20">
                    <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">FluentAI Tutor</h1>
                    <p class="text-xs text-slate-400">Groq AI Voice & Auto Model Fallback</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <div class="hidden sm:flex items-center space-x-1 px-3 py-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs rounded-lg">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>GPT-OSS 120B / 20B</span>
                </div>
                <button id="btn-config" class="flex items-center space-x-1.5 px-3 py-1.5 text-xs md:text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition shadow-md shadow-indigo-600/20">
                    <i data-lucide="sliders" class="w-4 h-4"></i>
                    <span>상황/캐릭터 설정</span>
                </button>
                <button id="btn-toggle-chats" class="flex items-center space-x-1.5 px-3 py-1.5 text-xs md:text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg transition">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    <span>채팅목록 (<span id="chat-count">1</span>/10)</span>
                </button>
            </div>
        </header>

        <!-- Main View Area -->
        <main class="flex-1 flex flex-col overflow-hidden relative">

            <div id="settings-backdrop" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-20 opacity-0 pointer-events-none transition-opacity duration-300"></div>

            <!-- Drawer: Chat List -->
            <aside id="chat-list-panel" class="fixed inset-y-0 left-0 w-full max-w-xs bg-slate-900 border-r border-slate-800 p-4 flex flex-col z-30 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl">
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="messages-square" class="w-5 h-5 text-indigo-400"></i>
                        <h2 class="font-semibold text-slate-100 text-base">대화 목록</h2>
                    </div>
                    <button id="btn-close-chats" class="p-1 text-slate-400 hover:text-white rounded-lg">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <button id="btn-new-chat" class="mt-4 w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center space-x-1.5 shadow-md">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>새 대화 만들기 (최대 10개)</span>
                </button>

                <div id="chat-rooms-container" class="mt-4 flex-1 overflow-y-auto space-y-2 pr-1"></div>
            </aside>

            <!-- Drawer: Settings Panel -->
            <aside id="settings-panel" class="fixed inset-y-0 right-0 w-full max-w-md bg-slate-900 border-l border-slate-800 p-6 flex flex-col justify-between z-30 transform translate-x-full transition-transform duration-300 ease-in-out shadow-2xl">
                <div class="space-y-6 overflow-y-auto pr-1">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                        <div class="flex items-center space-x-2">
                            <i data-lucide="sliders" class="w-5 h-5 text-indigo-400"></i>
                            <h2 class="font-semibold text-slate-100 text-base">상황 & 캐릭터 설정</h2>
                        </div>
                        <button id="btn-close-config" class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <!-- Avatar Picker -->
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">캐릭터 아바타 선택</label>
                        <div class="flex items-center space-x-2 overflow-x-auto pb-1" id="avatar-picker">
                            <button type="button" data-avatar="👔" class="avatar-btn p-2 text-xl bg-slate-800 hover:bg-indigo-600/30 border border-slate-700 rounded-xl transition shrink-0">👔</button>
                            <button type="button" data-avatar="❤️" class="avatar-btn p-2 text-xl bg-slate-800 hover:bg-indigo-600/30 border border-slate-700 rounded-xl transition shrink-0">❤️</button>
                            <button type="button" data-avatar="✈️" class="avatar-btn p-2 text-xl bg-slate-800 hover:bg-indigo-600/30 border border-slate-700 rounded-xl transition shrink-0">✈️</button>
                            <button type="button" data-avatar="☕" class="avatar-btn p-2 text-xl bg-slate-800 hover:bg-indigo-600/30 border border-slate-700 rounded-xl transition shrink-0">☕</button>
                            <button type="button" data-avatar="🤖" class="avatar-btn p-2 text-xl bg-slate-800 hover:bg-indigo-600/30 border border-slate-700 rounded-xl transition shrink-0">🤖</button>
                        </div>
                        <div class="mt-2 space-y-2">
                            <div class="flex items-center space-x-2">
                                <label for="input-avatar-file" class="flex-1 px-3 py-2 bg-slate-800 border border-slate-700 hover:border-indigo-500 rounded-lg text-xs text-slate-300 cursor-pointer flex items-center justify-center space-x-2 transition">
                                    <i data-lucide="image" class="w-4 h-4 text-indigo-400"></i>
                                    <span id="file-label-text">내 앨범에서 사진 선택</span>
                                </label>
                                <input id="input-avatar-file" type="file" accept="image/*" class="hidden">
                            </div>
                            <input id="input-avatar-url" type="text" placeholder="또는 이미지 URL 입력 (https://...)" class="w-full px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <!-- Coaching Toggle -->
                    <div class="p-3 bg-slate-800/60 rounded-xl border border-slate-700/80 flex items-center justify-between">
                        <div>
                            <div class="text-xs font-semibold text-slate-200">문법 & 표현 피드백 코칭</div>
                            <div class="text-[10px] text-slate-400">실시간 피드백 카드를 표시합니다</div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-coaching-setting" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                        </label>
                    </div>

                    <!-- Input Fields -->
                    <div class="space-y-4 pt-2 border-t border-slate-800">
                        <div>
                            <label for="input-character-name" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">캐릭터 이름</label>
                            <input id="input-character-name" type="text" placeholder="예: Alex" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                        </div>

                        <div>
                            <label for="input-character" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">상대방 역할 / 관계</label>
                            <input id="input-character" type="text" placeholder="예: 친절한 친구" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                        </div>

                        <div>
                            <label for="input-situation" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">상황 및 목적 설정</label>
                            <textarea id="input-situation" rows="3" placeholder="예: 카페에서 커피 마시며 자유 대화" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                        </div>

                        <div>
                            <label for="input-tone" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">말투 및 성격 지정</label>
                            <input id="input-tone" type="text" placeholder="예: 다정한, 자연스러운" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                        </div>

                        <div>
                            <label for="select-level" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">영어 피드백 레벨</label>
                            <select id="select-level" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                                <option value="Beginner">초급</option>
                                <option value="Intermediate" selected>중급</option>
                                <option value="Advanced">고급</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button id="btn-apply-settings" class="w-full mt-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>설정 적용하기</span>
                </button>
            </aside>

            <!-- Chat View Section -->
            <section class="flex-1 flex flex-col h-full bg-slate-950 relative overflow-hidden">
                <div class="px-6 py-3 bg-slate-900/40 border-b border-slate-800/60 flex items-center justify-between text-xs text-slate-400 shrink-0">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span class="font-medium text-slate-300">현재 상황:</span>
                        <span id="current-scenario-desc" class="truncate text-slate-400">설정 버튼을 눌러 상황을 지정하세요.</span>
                    </div>
                    <button id="btn-toggle-coaching-banner" class="flex items-center space-x-1.5 px-2.5 py-1 rounded border transition cursor-pointer text-indigo-400 bg-indigo-500/10 border-indigo-500/20 hover:bg-indigo-500/20 shrink-0">
                        <i data-lucide="shield-alert" class="w-3.5 h-3.5" id="coaching-icon"></i>
                        <span id="coaching-status-text">문법 교정 켜짐</span>
                    </button>
                </div>

                <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6"></div>

                <div id="typing-indicator" class="hidden px-6 py-2 flex items-center space-x-2 text-xs text-slate-400 shrink-0">
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-indigo-400"></i>
                    <span id="typing-text">상대방이 답변 및 피드백을 작성 중입니다...</span>
                </div>

                <div id="input-container-box" class="p-4 border-t border-slate-800 bg-slate-900/80 backdrop-blur-md shrink-0">
                    <form id="chat-form" class="max-w-4xl mx-auto flex items-center space-x-2">
                        <div class="relative flex-1">
                            <input id="user-input" type="text" autocomplete="off" placeholder="영어 또는 한국어로 대답해 보세요..." class="w-full py-3 pl-4 pr-10 bg-slate-800 border border-slate-700/80 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-slate-500 transition">
                            <button type="button" id="btn-mic" class="absolute right-2.5 top-2.5 p-1 text-slate-400 hover:text-indigo-400 rounded-lg transition" title="음성 입력">
                                <i data-lucide="mic" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <button type="submit" id="btn-send" class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl shadow-lg transition flex items-center justify-center shrink-0">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </form>
                    <div class="max-w-4xl mx-auto mt-2 flex items-center justify-between text-[11px] text-slate-500 px-1">
                        <span>* Groq API (openai/gpt-oss-120b → 20b Auto Fallback) 작동 중</span>
                        <span id="stt-status" class="hidden text-amber-400 animate-pulse">🎙️ 음성 인식 중...</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Script Application -->
    <script>
        // Streamlit Secrets에서 주입되는 자리
        const GROQ_API_KEYS = [
            '__GROQ_API_KEY__'
        ];

        // 메인 모델 및 예비(Fallback) 모델 목록
        const GROQ_MODELS = [
            'openai/gpt-oss-120b',
            'openai/gpt-oss-20b'
        ];

        let currentKeyIndex = 0;

        function getNextApiKey() {
            const key = GROQ_API_KEYS[currentKeyIndex];
            currentKeyIndex = (currentKeyIndex + 1) % GROQ_API_KEYS.length;
            return key;
        }

        // 모델 자동 전환(Fallback) + API 키 순환 Fetch 핸들러
        async function fetchWithModelAndKeyFallback(basePayload) {
            let lastError = null;
            const totalKeys = GROQ_API_KEYS.length;

            for (const modelName of GROQ_MODELS) {
                for (let i = 0; i < totalKeys; i++) {
                    const apiKey = getNextApiKey();
                    const payload = {
                        ...basePayload,
                        model: modelName
                    };

                    try {
                        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                            method: 'POST',
                            mode: 'cors',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey}`
                            },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            return response;
                        }

                        const errText = await response.text();
                        lastError = new Error(`[${modelName} / HTTP ${response.status}] ${errText || '서버 오류'}`);
                        console.warn(`모델 [${modelName}] 호출 실패. 다음 키 또는 예비 모델로 전환합니다. (에러: ${response.status})`);
                        
                        await new Promise(res => setTimeout(res, 100));
                    } catch (e) {
                        lastError = e;
                        console.warn(`네트워크 오류 발생. 재시도...`, e);
                        await new Promise(res => setTimeout(res, 100));
                    }
                }
            }

            throw lastError || new Error("Groq API 모델 및 키 요청 시도가 모두 실패하였습니다.");
        }

        const appRoot = document.getElementById('app-root');
        const btnConfig = document.getElementById('btn-config');
        const btnCloseConfig = document.getElementById('btn-close-config');
        const btnToggleChats = document.getElementById('btn-toggle-chats');
        const btnCloseChats = document.getElementById('btn-close-chats');
        const btnNewChat = document.getElementById('btn-new-chat');
        const btnApplySettings = document.getElementById('btn-apply-settings');
        const btnToggleCoachingBanner = document.getElementById('btn-toggle-coaching-banner');
        const coachingIcon = document.getElementById('coaching-icon');
        const coachingStatusText = document.getElementById('coaching-status-text');
        const toggleCoachingSetting = document.getElementById('toggle-coaching-setting');
        const settingsPanel = document.getElementById('settings-panel');
        const chatListPanel = document.getElementById('chat-list-panel');
        const settingsBackdrop = document.getElementById('settings-backdrop');
        const chatBox = document.getElementById('chat-box');
        const typingIndicator = document.getElementById('typing-indicator');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const btnMic = document.getElementById('btn-mic');
        const sttStatus = document.getElementById('stt-status');
        const currentScenarioDesc = document.getElementById('current-scenario-desc');
        const chatCountSpan = document.getElementById('chat-count');
        const chatRoomsContainer = document.getElementById('chat-rooms-container');
        const inputAvatarUrl = document.getElementById('input-avatar-url');
        const inputAvatarFile = document.getElementById('input-avatar-file');
        const fileLabelText = document.getElementById('file-label-text');

        const STORAGE_KEY_CHATS = 'fluentai_chats_data';
        const STORAGE_KEY_CURRENT_ID = 'fluentai_current_chat_id';

        let chats = loadChatsFromStorage();
        let currentChatId = localStorage.getItem(STORAGE_KEY_CURRENT_ID) || (chats[0] ? chats[0].id : 'chat-1');

        function loadChatsFromStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_CHATS);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {
                console.error("Failed to load chats:", e);
            }
            return [
                {
                    id: 'chat-1',
                    title: 'Alex',
                    avatar: '🤖',
                    enableCoaching: true,
                    persona: {
                        name: "Alex",
                        character: "Friendly Native English Friend",
                        situation: "Free conversation and casual catch up over coffee",
                        tone: "Casual, supportive, natural",
                        level: "Intermediate"
                    },
                    history: []
                }
            ];
        }

        function saveChatsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chats));
                localStorage.setItem(STORAGE_KEY_CURRENT_ID, currentChatId);
            } catch (e) {
                console.error("Failed to save chats:", e);
            }
        }

        let draftAvatarType = 'emoji';
        let draftAvatarValue = '🤖';

        function handleViewportResize() {
            window.scrollTo(0, 0);
            if (window.visualViewport) {
                appRoot.style.height = `${window.visualViewport.height}px`;
                appRoot.style.top = `${window.visualViewport.offsetTop}px`;
            } else {
                appRoot.style.height = `${window.innerHeight}px`;
            }
            scrollToBottom();
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', handleViewportResize);
            window.visualViewport.addEventListener('scroll', handleViewportResize);
        } else {
            window.addEventListener('resize', handleViewportResize);
        }

        document.body.addEventListener('touchmove', (e) => {
            if (!e.target.closest('#chat-box, #chat-rooms-container, #settings-panel')) {
                e.preventDefault();
            }
        }, { passive: false });

        function refreshIcons() {
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        inputAvatarFile.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 3 * 1024 * 1024) {
                    alert('사진 용량이 3MB 이하인 이미지를 선택하세요.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    draftAvatarType = 'file';
                    draftAvatarValue = e.target.result;
                    inputAvatarUrl.value = '';
                    fileLabelText.textContent = `📷 ${file.name.slice(0, 10)}...`;
                    updateAvatarHighlight('');
                };
                reader.readAsDataURL(file);
            }
        });

        inputAvatarUrl.addEventListener('input', () => {
            const val = inputAvatarUrl.value.trim();
            if (val) {
                draftAvatarType = 'url';
                draftAvatarValue = val;
                fileLabelText.textContent = '내 앨범에서 사진 선택';
                updateAvatarHighlight('');
            }
        });

        document.querySelectorAll('.avatar-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const avatar = btn.getAttribute('data-avatar');
                draftAvatarType = 'emoji';
                draftAvatarValue = avatar;
                inputAvatarUrl.value = '';
                fileLabelText.textContent = '내 앨범에서 사진 선택';
                updateAvatarHighlight(avatar);
            });
        });

        function updateAvatarHighlight(emoji) {
            document.querySelectorAll('.avatar-btn').forEach(btn => {
                if (btn.getAttribute('data-avatar') === emoji) {
                    btn.classList.add('border-indigo-500', 'bg-indigo-600/30');
                } else {
                    btn.classList.remove('border-indigo-500', 'bg-indigo-600/30');
                }
            });
        }

        btnToggleCoachingBanner.addEventListener('click', () => {
            const activeChat = getCurrentChat();
            activeChat.enableCoaching = !activeChat.enableCoaching;
            updateCoachingUI(activeChat.enableCoaching);
            saveChatsToStorage();
        });

        function updateCoachingUI(isEnabled) {
            toggleCoachingSetting.checked = isEnabled;
            if (isEnabled) {
                btnToggleCoachingBanner.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded border transition cursor-pointer text-indigo-400 bg-indigo-500/10 border-indigo-500/20 hover:bg-indigo-500/20 shrink-0";
                coachingStatusText.textContent = "문법 교정 켜짐";
                coachingIcon.setAttribute('data-lucide', 'shield-alert');
            } else {
                btnToggleCoachingBanner.className = "flex items-center space-x-1.5 px-2.5 py-1 rounded border transition cursor-pointer text-slate-500 bg-slate-800/50 border-slate-700 hover:bg-slate-800 shrink-0";
                coachingStatusText.textContent = "문법 교정 끔";
                coachingIcon.setAttribute('data-lucide', 'shield-off');
            }
            refreshIcons();
        }

        function populateSettingsForm() {
            const currentChat = getCurrentChat();
            document.getElementById('input-character-name').value = currentChat.persona.name || '';
            document.getElementById('input-character').value = currentChat.persona.character || '';
            document.getElementById('input-situation').value = currentChat.persona.situation || '';
            document.getElementById('input-tone').value = currentChat.persona.tone || '';
            document.getElementById('select-level').value = currentChat.persona.level || 'Intermediate';
            toggleCoachingSetting.checked = currentChat.enableCoaching !== false;
            
            const currentAvatar = currentChat.avatar || '🤖';
            if (currentAvatar.startsWith('data:image')) {
                draftAvatarType = 'file';
                draftAvatarValue = currentAvatar;
                fileLabelText.textContent = '📷 사진 선택됨';
                inputAvatarUrl.value = '';
                updateAvatarHighlight('');
            } else if (currentAvatar.startsWith('http')) {
                draftAvatarType = 'url';
                draftAvatarValue = currentAvatar;
                inputAvatarUrl.value = currentAvatar;
                fileLabelText.textContent = '내 앨범에서 사진 선택';
                updateAvatarHighlight('');
            } else {
                draftAvatarType = 'emoji';
                draftAvatarValue = currentAvatar;
                inputAvatarUrl.value = '';
                fileLabelText.textContent = '내 앨범에서 사진 선택';
                updateAvatarHighlight(currentAvatar);
            }
        }

        btnApplySettings.addEventListener('click', () => {
            const name = document.getElementById('input-character-name').value.trim() || 'Alex';
            const char = document.getElementById('input-character').value.trim() || 'AI Partner';
            const sit = document.getElementById('input-situation').value.trim() || 'Free Talking';
            const tone = document.getElementById('input-tone').value.trim() || 'Friendly';
            const lvl = document.getElementById('select-level').value;

            const currentChat = getCurrentChat();
            currentChat.persona = { name, character: char, situation: sit, tone, level: lvl };
            currentChat.title = `${name} (${char})`;
            currentChat.avatar = draftAvatarValue || '🤖';
            currentChat.enableCoaching = toggleCoachingSetting.checked;

            saveChatsToStorage();
            renderCurrentChat();
            closeSettings();
        });

        function getCurrentChat() {
            return chats.find(c => c.id === currentChatId) || chats[0];
        }

        btnNewChat.addEventListener('click', () => {
            if (chats.length >= 10) {
                alert("채팅방은 최대 10개까지 생성할 수 있습니다.");
                return;
            }
            const newId = `chat-${Date.now()}`;
            const newChat = {
                id: newId,
                title: `Partner ${chats.length + 1}`,
                avatar: '🤖',
                enableCoaching: true,
                persona: {
                    name: "Sam",
                    character: "English Partner",
                    situation: "Casual chit-chat in a park",
                    tone: "Friendly and encouraging",
                    level: "Intermediate"
                },
                history: []
            };
            chats.push(newChat);
            currentChatId = newId;
            saveChatsToStorage();
            renderChatRoomsList();
            renderCurrentChat();
            closeChatList();
            openSettings();
        });

        function renderCurrentChat() {
            const activeChat = getCurrentChat();
            currentScenarioDesc.textContent = `[${activeChat.persona.name} / ${activeChat.persona.character}] ${activeChat.persona.situation}`;
            chatCountSpan.textContent = chats.length;
            updateCoachingUI(activeChat.enableCoaching !== false);
            
            chatBox.innerHTML = '';
            
            if (activeChat.history.length === 0) {
                const msgEl = document.createElement('div');
                msgEl.className = 'flex items-start space-x-3 max-w-2xl';
                msgEl.innerHTML = `
                    ${renderAvatarBadge(activeChat.avatar)}
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-slate-200 shadow-sm space-y-2">
                        <p class="font-semibold text-sm text-indigo-400">${escapeHtml(activeChat.persona.name)} (${escapeHtml(activeChat.persona.character)})</p>
                        <p class="text-sm leading-relaxed">
                            Hello! My name is ${escapeHtml(activeChat.persona.name)}. Ready to practice English? Type something below or tell me about your day!
                        </p>
                    </div>
                `;
                chatBox.appendChild(msgEl);
            } else {
                activeChat.history.forEach(msg => {
                    if (msg.role === 'user') {
                        appendUserMessageUI(msg.text);
                    } else if (msg.role === 'model' || msg.role === 'assistant') {
                        try {
                            const parsed = typeof msg.text === 'string' ? JSON.parse(msg.text) : msg.text;
                            appendAIMessageUI(parsed, false);
                        } catch (e) {
                            appendAIMessageUI({ reply: msg.text }, false);
                        }
                    }
                });
            }
            scrollToBottom();
            refreshIcons();
        }

        function renderAvatarBadge(avatar) {
            if (avatar && (avatar.startsWith('http') || avatar.startsWith('data:image'))) {
                return `<img src="${escapeHtml(avatar)}" class="w-8 h-8 rounded-full object-cover shrink-0 border border-indigo-500/40" onerror="this.src='https://placehold.co/40x40/6366f1/white?text=AI'">`;
            }
            return `
                <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center shrink-0 text-base">
                    ${avatar || '🤖'}
                </div>
            `;
        }

        function buildSystemInstruction() {
            const activeChat = getCurrentChat();
            const persona = activeChat.persona;
            const coachingEnabled = activeChat.enableCoaching !== false;

            return `
You are an interactive AI English Tutor and Roleplay Partner.
Your Role Persona:
- Your Name: ${persona.name || 'Alex'}
- Your Role/Character: ${persona.character}
- Current Situation/Context: ${persona.situation}
- Speaking Tone/Personality: ${persona.tone}
- Student's English Proficiency Level: ${persona.level}

YOUR DUTIES:
1. Stay in character as "${persona.name}"! Lead context forward and ask questions.
2. Return strictly valid JSON object only.
3. JSON Schema:
{
  "reply": "In-character English response.",
  "translation": "한국어 번역",
  "corrections": [
    {
      "original": "User's mistake",
      "corrected": "Corrected English",
      "explanation": "Simple Korean explanation"
    }
  ]
}

COACHING MODE: ${coachingEnabled ? "ON" : "OFF"}
${coachingEnabled ? 'Analyze input for grammar/typo. Return 1-3 items in "corrections". If error-free, return [].' : 'Coaching OFF. Always return empty array [] for "corrections".'}
`;
        }

        function appendAIMessageUI(data, triggerSpeech = true) {
            const activeChat = getCurrentChat();
            const msgEl = document.createElement('div');
            msgEl.className = 'flex items-start space-x-3 max-w-2xl';

            let correctionsHTML = '';
            if (activeChat.enableCoaching !== false && data.corrections && data.corrections.length > 0) {
                correctionsHTML = `
                    <div class="mt-3 pt-3 border-t border-slate-800 bg-amber-500/10 -mx-4 -mb-4 p-3.5 rounded-b-2xl border-l-2 border-amber-500 space-y-2">
                        <div class="flex items-center space-x-1.5 text-xs font-semibold text-amber-400">
                            <i data-lucide="wrench" class="w-3.5 h-3.5"></i>
                            <span>Grammar & Expression Coaching</span>
                        </div>
                        <div class="space-y-2 text-xs">
                            ${data.corrections.map(c => `
                                <div class="bg-slate-900/80 p-2 rounded border border-amber-500/20">
                                    <div class="text-rose-400/90 line-through">❌ ${escapeHtml(c.original)}</div>
                                    <div class="text-emerald-400 font-medium mt-0.5">✅ ${escapeHtml(c.corrected)}</div>
                                    <div class="text-slate-300 text-[11px] mt-1 pl-2 border-l border-slate-700">${escapeHtml(c.explanation)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            msgEl.innerHTML = `
                ${renderAvatarBadge(activeChat.avatar)}
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-slate-200 shadow-sm space-y-2 relative group flex-1">
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-xs text-indigo-400">${escapeHtml(activeChat.persona.name || activeChat.persona.character)}</span>
                    </div>
                    <p class="text-sm leading-relaxed">${escapeHtml(data.reply)}</p>
                    ${data.translation ? `<p class="text-xs text-slate-400 border-t border-slate-800/60 pt-2 font-light">${escapeHtml(data.translation)}</p>` : ''}
                    ${correctionsHTML}
                </div>
            `;

            chatBox.appendChild(msgEl);
            refreshIcons();
            scrollToBottom();
        }

        async function fetchAIResponse(userMessage, isInitial = false) {
            const activeChat = getCurrentChat();
            const systemPrompt = buildSystemInstruction();

            let messages = [
                { role: 'system', content: systemPrompt }
            ];
            
            activeChat.history.forEach(item => {
                if (item.role === 'user') {
                    messages.push({
                        role: 'user',
                        content: item.text
                    });
                } else if (item.role === 'model' || item.role === 'assistant') {
                    let textContent = typeof item.text === 'object' ? JSON.stringify(item.text) : item.text;
                    messages.push({
                        role: 'assistant',
                        content: textContent
                    });
                }
            });

            if (isInitial && messages.length === 1) {
                messages.push({
                    role: 'user',
                    content: `Hello! Please start our roleplay in character as "${activeChat.persona.name}". Greet me warmly in English.`
                });
            } else if (userMessage) {
                const lastMsg = messages[messages.length - 1];
                if (!lastMsg || lastMsg.role !== 'user' || lastMsg.content !== userMessage) {
                    messages.push({
                        role: 'user',
                        content: userMessage
                    });
                }
            }

            const basePayload = {
                messages: messages,
                response_format: { type: "json_object" },
                temperature: 0.7
            };

            let response;
            try {
                response = await fetchWithModelAndKeyFallback(basePayload);
            } catch (err) {
                console.error("Groq API 호출 오류:", err);
                throw new Error(`[Groq API 오류]: ${err.message || 'API 키 권한 및 네트워크 상태를 확인해주세요.'}`);
            }

            const result = await response.json();
            const jsonText = result.choices?.[0]?.message?.content;

            if (!jsonText) {
                throw new Error("Groq API로부터 응답 텍스트를 받지 못했습니다.");
            }

            const cleanedJson = jsonText.replace(/^```json\s*/i, '').replace(/\s*```$/i, '').trim();
            return JSON.parse(cleanedJson);
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendUserMessageUI(text);

            const activeChat = getCurrentChat();
            activeChat.history.push({ role: 'user', text });
            saveChatsToStorage();

            typingIndicator.classList.remove('hidden');

            try {
                const aiData = await fetchAIResponse(text, false);
                activeChat.history.push({ role: 'assistant', text: JSON.stringify(aiData) });
                saveChatsToStorage();
                appendAIMessageUI(aiData, true);
            } catch (err) {
                console.error("Groq API Error:", err);
                const errorData = {
                    reply: "I couldn't process your response due to an API or network error. Please check your Groq API key in Streamlit Secrets!",
                    translation: `[시스템 오류 발생]: ${err.message || 'Streamlit Secrets에 GROQ_API_KEY가 등록되었는지 확인해 주세요.'}`,
                    corrections: []
                };
                appendAIMessageUI(errorData, false);
            } finally {
                typingIndicator.classList.add('hidden');
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onstart = () => sttStatus.classList.remove('hidden');
            recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; };
            recognition.onerror = () => sttStatus.classList.add('hidden');
            recognition.onend = () => sttStatus.classList.add('hidden');

            btnMic.addEventListener('click', () => {
                try { recognition.start(); } catch (e) { recognition.stop(); }
            });
        } else {
            btnMic.style.display = 'none';
        }

        function openSettings() {
            populateSettingsForm();
            settingsPanel.classList.remove('translate-x-full');
            settingsBackdrop.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeSettings() {
            settingsPanel.classList.add('translate-x-full');
            if (chatListPanel.classList.contains('-translate-x-full')) {
                settingsBackdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function openChatList() {
            renderChatRoomsList();
            chatListPanel.classList.remove('-translate-x-full');
            settingsBackdrop.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeChatList() {
            chatListPanel.classList.add('-translate-x-full');
            if (settingsPanel.classList.contains('translate-x-full')) {
                settingsBackdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        btnConfig.addEventListener('click', openSettings);
        btnCloseConfig.addEventListener('click', closeSettings);
        btnToggleChats.addEventListener('click', openChatList);
        btnCloseChats.addEventListener('click', closeChatList);
        settingsBackdrop.addEventListener('click', () => {
            closeSettings();
            closeChatList();
        });

        function renderChatRoomsList() {
            chatRoomsContainer.innerHTML = '';
            chats.forEach((chat) => {
                const isSelected = chat.id === currentChatId;
                const itemEl = document.createElement('div');
                itemEl.className = `flex items-center justify-between p-3 rounded-xl cursor-pointer border transition ${
                    isSelected 
                        ? 'bg-indigo-600/20 border-indigo-500/80 text-white' 
                        : 'bg-slate-800/60 border-slate-700/60 text-slate-300 hover:bg-slate-800'
                }`;
                
                itemEl.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden flex-1 chat-room-select" data-id="${chat.id}">
                        ${renderAvatarBadge(chat.avatar)}
                        <div class="truncate">
                            <div class="font-medium text-xs truncate">${escapeHtml(chat.title || '대화방')}</div>
                            <div class="text-[10px] text-slate-400 truncate">${escapeHtml(chat.persona.situation)}</div>
                        </div>
                    </div>
                    ${chats.length > 1 ? `
                        <button type="button" class="btn-delete-room p-1.5 text-slate-400 hover:text-rose-400 hover:bg-slate-700/50 rounded-lg transition" data-id="${chat.id}" title="삭제">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    ` : ''}
                `;
                chatRoomsContainer.appendChild(itemEl);
            });

            chatRoomsContainer.querySelectorAll('.chat-room-select').forEach(el => {
                el.addEventListener('click', () => switchChatRoom(el.getAttribute('data-id')));
            });

            chatRoomsContainer.querySelectorAll('.btn-delete-room').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChatRoom(btn.getAttribute('data-id'));
                });
            });

            refreshIcons();
        }

        function switchChatRoom(id) {
            currentChatId = id;
            saveChatsToStorage();
            renderCurrentChat();
            closeChatList();
        }

        function deleteChatRoom(id) {
            if (chats.length <= 1) return;
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) {
                currentChatId = chats[0].id;
            }
            saveChatsToStorage();
            renderChatRoomsList();
            renderCurrentChat();
        }

        function appendUserMessageUI(text) {
            const msgEl = document.createElement('div');
            msgEl.className = 'flex items-start justify-end space-x-3';
            msgEl.innerHTML = `
                <div class="bg-indigo-600 text-white rounded-2xl p-4 text-sm max-w-lg shadow-md shadow-indigo-600/20 leading-relaxed">
                    ${escapeHtml(text)}
                </div>
            `;
            chatBox.appendChild(msgEl);
            scrollToBottom();
        }

        handleViewportResize();
        renderCurrentChat();
    </script>
</body>
</html>
